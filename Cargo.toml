[package]
name = "chadehoc-srp6"
version = "0.1.0"
authors = [
    "Sven Assmann <sven.assmann.it@gmail.com>",
    "Chadehoc <1562517+Chadehoc@users.noreply.github.com>",
    # also Github user "valpaq"
]
edition = "2021"
description = "Implementation of the secure remote password authentication and key-exchange protocol SRP-6a"
license = "MIT"
include = ["src", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
crypto-bigint = { version = "0.6.0", features = ["rand", "alloc", "serde"] }
derive_more = { version = "2.0.1", features = ["error", "display"] }
hex-literal = "0.4.1"
num-traits = "0.2"
serde = { version = "1.0.217", features = ["derive"] }
sha1 = "0.10.1"

[dev-dependencies]
serde_json = "1.0.137"

[features]
# use this in tests to remove randomness and use the test data
# in RFC 5054 appendix B
norand = []
# use this to allow empirical micro-optimisation
emp = []
