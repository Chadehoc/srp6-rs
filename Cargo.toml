[package]
name = "chadehoc-srp6"
version = "0.1.0"
authors = [
    "Sven Assmann <sven.assmann.it@gmail.com>",
    "Chadehoc <1562517+Chadehoc@users.noreply.github.com>",
    # also Github user "valpaq"
]
edition = "2024"
description = "Implementation of the secure remote password authentication and key-exchange protocol SRP-6a"
license = "MIT"
include = ["src", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
crypto-bigint = { version = "0.6.1", features = ["rand", "alloc", "serde", "zeroize"] }
derive_more = { version = "2.0.1", features = ["error", "display"] }
hex-literal = "1.0.0"
num-traits = "0.2.19"
serde = { version = "1.0.218", features = ["derive"] }
sha1 = "0.10.6"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

# fuzzing
arbitrary = { version = "1.4.1", optional = true, features = ["derive"] }

[dev-dependencies]
postcard = { version = "1.1.1", features = ["use-std"] }
serde_json = "1.0.140"

[features]
# allow empirical micro-optimisation
emp = []
