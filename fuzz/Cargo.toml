[package]
name = "chadehoc-srp6-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

[dependencies.chadehoc-srp6]
path = ".."
features = ["arbitrary", "emp"]

[[bin]]
name = "srp"
path = "fuzz_targets/srp.rs"
test = false
doc = false
bench = false
